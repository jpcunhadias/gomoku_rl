[project]
name = "gomoku-rl"
version = "0.1.0"
description = "AlphaZero-style self-play RL for 8x8 Gomoku"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "matplotlib>=3.5",
    "tqdm>=4.64",
    "scikit-learn>=1.1",
    "tensorboard>=2.10",
    "captum>=0.6",
    "shap>=0.41",
    "llvmlite>=0.43",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.10",
    "pytest>=7.0",
    "pre-commit>=3.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "configs", "debug", "game", "mcts", "model", "scripts", "train", "utils"]
